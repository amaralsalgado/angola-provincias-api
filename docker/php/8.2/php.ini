; LIMITS

memory_limit = 512M
; Max memory per script (default 128M).

upload_max_filesize = 64M
; Max size of one uploaded file.

post_max_size = 64M
; Max POST body size. Keep >= upload_max_filesize.

; OPcache: pick up code edits on every request
opcache.revalidate_freq = 0
; Seconds between file checks (default 2).
